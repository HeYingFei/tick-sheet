server:
  port: 8080

spring:
  application:
    name: todo-backend
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    # 显式输出 null 字段。前端编辑弹窗用 Object.assign(form, task) 回填，
    # 若省略 null 键，上一个任务的截止时间/完成时间会残留到下一个任务的表单里。
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.todo.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    # 允许的跨域来源模式，逗号分隔，支持通配。
    # 开发期放开，避免用局域网 IP / IDE 预览域名访问时预检被拒（Invalid CORS request）；
    # 生产环境经 Nginx 同源代理后应收紧为具体域名，例如
    # allowed-origin-patterns: "https://todo.example.com"
    allowed-origin-patterns: "*"
  backup:
    # 备份文件存储目录（相对后端运行目录）
    dir: ./data/backup
    # 备份文件保留上限，超出时提示用户手动清理，不自动删除
    keep-max: 20

auth:
  # JWT 签名密钥，生产环境务必修改为随机长字符串
  secret: todo-system-dev-secret-change-in-production
  # Token 有效期，7 天（毫秒）
  expire-ms: 604800000

logging:
  level:
    com.todo: debug

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="#F4F5F3" />
    <title>任务管理系统</title>
    <!-- 运行时配置：必须早于下方的 module 脚本。现场改后端地址只需编辑 public/apiConfig.js -->
    <script src="%BASE_URL%apiConfig.js"></script>
    <script>
      // 在首屏渲染前应用主题，避免深色与玻璃主题下出现白屏闪烁
      // glass-dark 是玻璃与深色的组合态，两个类都要挂
      const themeMode = localStorage.getItem('todo_theme_mode')
      if (themeMode === 'dark' || themeMode === 'glass-dark') {
        document.documentElement.classList.add('dark')
      }
      if (themeMode === 'glass' || themeMode === 'glass-dark') {
        document.documentElement.classList.add('glass')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
